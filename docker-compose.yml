services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://aco:aco@postgres:5432/aco
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    volumes:
      # Mount strategies read-only so edits don't require a rebuild.
      - ./strategies.yaml:/app/strategies.yaml:ro
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aco
      POSTGRES_PASSWORD: aco
      POSTGRES_DB: aco
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
